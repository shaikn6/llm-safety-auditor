name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: |
          # Pinned: an unpinned "pip install ruff" broke a sibling project's
          # CI when a routine install silently picked up a newer ruff
          # release with a much broader default lint rule set (141
          # unrelated findings surfaced on an unrelated push there). Pinning
          # here so this repo's effective rule set only changes on a
          # deliberate version bump.
          pip install ruff==0.16.0
          ruff check src/ tests/
          ruff format --check src/ tests/
      - name: Test with coverage
        run: |
          pip install pytest pytest-cov
          pytest tests/ -v --cov --cov-report=term-missing --cov-fail-under=95

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install security tools
        run: pip install bandit pip-audit
      - name: SAST — bandit
        run: bandit -r src/ -ll -ii --format json -o bandit-report.json; bandit -r src/ -ll -ii
        continue-on-error: false
      - name: Dependency audit — pip-audit
        run: pip-audit --desc -r requirements.txt
        continue-on-error: true
      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-report-${{ github.run_id }}
          path: bandit-report.json
          if-no-files-found: ignore
